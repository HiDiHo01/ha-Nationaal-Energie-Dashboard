[build-system]
requires = ["uv_build==0.13.9"]
build-backend = "uv_build"

[project]
name = "ned-api"
version = "0.0.0"
description = "Independent Nationaal Energie Dashboard API library"
readme = "README.md"
requires-python = ">=3.14.2"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["aiohttp>=3.14.5,<4", "yarl>=1.25.1,<2"]

[project.optional-dependencies]
test = ["pytest>=9,<10", "pytest-asyncio", "cryptography>=50.0.2,<51", "pytest-socket==0.8.1"]

[project.urls]
Repository = "https://github.com/HiDiHo01/ha-Nationaal-Energie-Dashboard"
Issues = "https://github.com/HiDiHo01/ha-Nationaal-Energie-Dashboard/issues"
