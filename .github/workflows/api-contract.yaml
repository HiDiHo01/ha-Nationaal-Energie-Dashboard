name: NED API contract observation

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Full matrix or remaining timezone observations only
        type: choice
        options: [full, timezone]
        default: timezone
        required: true
      confirm_live:
        description: Authorize up to 6 (timezone) or 18 (full) read-only requests
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: ned-live-contract
  cancel-in-progress: false

jobs:
  observe:
    if: >-
      github.repository == 'HiDiHo01/ha-Nationaal-Energie-Dashboard' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_live
    environment: ned-contract
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - name: Observe fixed national P0, pagination and timezone contract
        env:
          NED_API_KEY: ${{ secrets.NED_API_KEY }}
          NED_CONTRACT_SCOPE: ${{ inputs.scope }}
        run: python -m scripts.ned_contract_extended
