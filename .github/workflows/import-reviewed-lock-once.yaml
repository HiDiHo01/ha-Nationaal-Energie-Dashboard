name: Import reviewed uv lock (one time)

on:
  push:
    branches:
      - fix/commit-uv-lock-14951867926

permissions:
  actions: read
  contents: write

jobs:
  import-lock:
    if: github.repository == 'HiDiHo01/ha-Nationaal-Energie-Dashboard' && github.ref == 'refs/heads/fix/commit-uv-lock-14951867926'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Import exact reviewed artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          gh run download 45460011995 --repo "$GITHUB_REPOSITORY" --name uv-lock-candidate --dir "$work"
          printf '%s  %s\n' '447ee21d3433a51af600adbdbabd97b32421b37d297d5d105e2130072f3e902e' "$work/uv.lock" | sha256sum -c -
          branch='fix/commit-uv-lock-14951867926'
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
          test "$current" = "$GITHUB_SHA"
          python - "$work/uv.lock" "$work/payload.json" "$branch" <<'PY'
          import base64
          import json
          import sys
          from pathlib import Path

          source, target, branch = sys.argv[1:]
          Path(target).write_text(json.dumps({
              "message": "build: commit reviewed uv.lock",
              "content": base64.b64encode(Path(source).read_bytes()).decode("ascii"),
              "branch": branch,
          }), encoding="utf-8")
          PY
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/uv.lock" --input "$work/payload.json" --jq '.commit.sha'
