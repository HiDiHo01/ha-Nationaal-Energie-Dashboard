name: Project documentation site

on:
  pull_request:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yaml']
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yaml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate and stage explicitly public files
        shell: bash
        run: |
          set -euo pipefail
          mkdir _site
          for file in index.html en.html styles.css; do
            test -f "site/$file"
            test ! -L "site/$file"
            cp "site/$file" "_site/$file"
          done
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          from urllib.parse import urlsplit

          root = Path("_site")
          expected = {"index.html": "nl", "en.html": "en"}
          for filename, language in expected.items():
              page = ElementTree.parse(root / filename).getroot()
              if page.tag != "html" or page.get("lang") != language:
                  raise SystemExit(f"Invalid language: {filename}")
              if len(page.findall(".//h1")) != 1:
                  raise SystemExit(f"Expected one h1: {filename}")
              if page.findall(".//script") or page.findall(".//iframe"):
                  raise SystemExit(f"Unexpected executable or embedded content: {filename}")
              for element in page.iter():
                  for attr in ("href", "src"):
                      target = element.get(attr)
                      if not target:
                          continue
                      parsed = urlsplit(target)
                      if parsed.scheme == "https" and parsed.netloc:
                          continue
                      if parsed.scheme or parsed.netloc or parsed.path not in {
                          "index.html", "en.html", "styles.css"
                      } or not (root / parsed.path).is_file():
                          raise SystemExit(f"Invalid link: {filename}")
          print("Public files and bilingual page structure validated.")
          PY
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.repository == 'HiDiHo01/ha-Nationaal-Energie-Dashboard' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
