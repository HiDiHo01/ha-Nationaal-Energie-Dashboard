name: Marketplace validation

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  marketplace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require integration metadata
        shell: bash
        run: |
          test -f hacs.json
          test -f custom_components/nationaal_energie_dashboard/manifest.json
          test -f custom_components/nationaal_energie_dashboard/__init__.py
      - name: Validate Marketplace repository
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          comment: 'false'
