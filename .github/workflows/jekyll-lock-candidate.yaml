name: Resolve Jekyll lock candidate (one time)
on:
  push:
    branches: [feature/jekyll-project-pages]
    paths: [site/Gemfile, site/.ruby-version, .github/workflows/jekyll-lock-candidate.yaml]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
        with:
          working-directory: site
          bundler-cache: false
      - name: Resolve and inspect public gem lock
        working-directory: site
        run: |
          bundle lock --add-platform ruby --add-checksums
          echo 'LOCKFILE_BEGIN'
          cat Gemfile.lock
          echo 'LOCKFILE_END'
          sha256sum Gemfile.lock
