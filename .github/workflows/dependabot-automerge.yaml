name: Dependabot auto-merge

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    if: >-
      github.repository == 'HiDiHo01/ha-Nationaal-Energie-Dashboard' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/') &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.policy.outputs.eligible }}
    steps:
      - name: Verify Dependabot metadata and commits
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Check update policy
        id: policy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCIES: ${{ steps.metadata.outputs.dependency-names }}
          MAINTAINER_CHANGES: ${{ steps.metadata.outputs.maintainer-changes }}
        run: |
          set -euo pipefail
          echo 'eligible=false' >> "$GITHUB_OUTPUT"
          case "$UPDATE_TYPE" in
            version-update:semver-minor|version-update:semver-patch) ;;
            *) echo 'Manual review: major or unknown update type.'; exit 0 ;;
          esac
          if [[ -z "$DEPENDENCIES" || "$MAINTAINER_CHANGES" != false ]]; then
            echo 'Manual review: missing dependency metadata or maintainer changes.'
            exit 0
          fi
          if printf '%s\n' "$DEPENDENCIES" | tr ',' '\n' | grep -Eiq '^[[:space:]]*(homeassistant|pytest[-_]homeassistant)[[:space:]]*$'; then
            echo 'Manual review: Core/test baseline must be updated together.'
            exit 0
          fi
          current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
          if [[ "$current" != "$HEAD_SHA" ]]; then
            echo 'PR changed; a new evaluation is required.'
            exit 0
          fi
          files=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100")
          if ! jq -e 'add | length > 0 and all(.[]; .status == "modified" and (.filename == "uv.lock" or .filename == "pyproject.toml" or (.filename | test("^\\.github/workflows/(ci|hassfest|hacs|python-next-smoke|baseline-watch)\\.yaml$")))) and (if any(.[]; .filename == "pyproject.toml") then any(.[]; .filename == "uv.lock") else true end)' <<< "$files" >/dev/null; then
            echo 'Manual review: changes outside approved dependency files or missing lockfile update.'
            exit 0
          fi
          # Workflow changes may only replace pinned action references, not CI logic.
          if ! jq -e 'add | all(.[] | select(.filename | startswith(".github/workflows/")); (.patch // "") as $p | ($p | split("\n") | map(select(test("^[+-]")))) as $lines | ($lines | length > 0) and all($lines[]; test("^[+-]\\s*-?\\s*uses: [A-Za-z0-9_./-]+@[a-f0-9]{40}( #[^\\n]*)?$")) and (($lines | map(select(startswith("-")) | sub("^-"; "") | sub("@[a-f0-9]{40}.*$"; "")) | sort) == ($lines | map(select(startswith("+")) | sub("^\\+"; "") | sub("@[a-f0-9]{40}.*$"; "")) | sort)))' <<< "$files" >/dev/null; then
            echo 'Manual review: workflow changes are not solely action-pin updates.'
            exit 0
          fi
          echo 'eligible=true' >> "$GITHUB_OUTPUT"
          echo 'Eligible dependency update; required checks must pass before merge.'

  merge:
    needs: classify
    if: needs.classify.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
    steps:
      - name: Wait for required checks and merge the verified revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Never check out or run code from the pull request in this workflow.
          # Poll briefly because CI may not have registered its checks yet.
          for attempt in $(seq 1 100); do
            current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
            if [[ "$current" != "$HEAD_SHA" ]]; then
              echo 'PR changed; refusing to merge a different revision.'
              exit 0
            fi
            if checks=$(gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --required --json name,bucket); then
              :
            elif [[ -z "$checks" ]]; then
              sleep 15
              continue
            fi
            if jq -e 'any(.[]; .bucket == "fail" or .bucket == "cancel")' <<< "$checks" >/dev/null; then
              echo 'Required CI failed or was cancelled; no merge.'
              exit 1
            fi
            if jq -e 'length > 0 and all(.[]; .bucket == "pass") and any(.[]; .name == "Home Assistant production baseline") and any(.[]; .name == "hassfest")' <<< "$checks" >/dev/null; then
              # GitHub enforces the active ruleset, including an up-to-date base.
              gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$HEAD_SHA"
              exit 0
            fi
            sleep 15
          done
          echo 'Required checks did not all pass within the wait window; no merge.' >&2
          exit 1
