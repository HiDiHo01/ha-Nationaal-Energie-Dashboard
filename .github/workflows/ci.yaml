name: Baseline CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_PYTHON_DOWNLOADS: never
  PYTHONPATH: packages/ned-api/src

jobs:
  baseline:
    name: Home Assistant production baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - name: Check version consistency
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          import tomllib
          from pathlib import Path

          pin = Path('.python-version').read_text().strip()
          core = json.loads(Path('hacs.json').read_text())['homeassistant']
          config = tomllib.loads(Path('pyproject.toml').read_text())
          version = '.'.join(map(str, sys.version_info[:2]))
          assert '.'.join(map(str, sys.version_info[:3])) == pin
          assert f'homeassistant=={core}' in config['dependency-groups']['dev']
          assert f'pytest-homeassistant=={core}' in config['dependency-groups']['dev']
          assert config['tool']['ruff']['target-version'] == f'py{version.replace(".", "")}'
          assert config['tool']['mypy']['python_version'] == version
          assert config['tool']['pylint']['main']['py-version'] == version
          print(f'Core {core}; Python {pin}')
          PY
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          enable-cache: false
      - name: Verify committed dependency lock
        id: lock
        run: uv lock --check --python "$(command -v python)"
      - name: Install exact baseline and check dependencies
        run: |
          uv sync --locked --python "$(command -v python)"
          uv pip check
          uv run --no-sync python -c 'import homeassistant; from importlib.metadata import version; print(version("homeassistant"), version("pytest-homeassistant"))'
          uv run --no-sync ruff --version
          uv run --no-sync pylint --version
          uv run --no-sync mypy --version
          uv run --no-sync pytest --version
      - name: Validate configuration, documentation, translations and run pre-commit
        run: |
          uv run --no-sync pre-commit validate-config
          uv run --no-sync pre-commit run --all-files --show-diff-on-failure
      - name: Quality and offline tests
        shell: bash
        run: |
          if [[ -z "$(find custom_components packages tests -type f -name '*.py' -print -quit)" ]]; then
            echo 'Source quality and test coverage not evaluated: no Python implementation yet.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          uv run --no-sync python -m compileall -q custom_components packages tests
          uv run --no-sync pytest --cov --cov-branch --cov-report=term-missing --cov-report=json
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('coverage.json').read_text())
          total = report['totals']
          branches = total['num_branches']
          if branches and 100 * total['covered_branches'] < 95 * branches:
              raise SystemExit('Overall branch coverage below 95%')
          for path, info in report['files'].items():
              name = Path(path).name
              if name in {'config_flow.py', 'diagnostics.py'} or name.startswith('forecast'):
                  minimum = 100
              elif name in {'client.py', 'transport.py', 'parser.py', 'models.py', 'coordinator.py', 'sensor.py', 'binary_sensor.py', 'services.py'}:
                  minimum = 95
              else:
                  continue
              if info['summary']['percent_covered'] < minimum:
                  raise SystemExit(f'{path}: coverage below {minimum}%')
          PY
      - name: Build and verify independent API wheel
        shell: bash
        run: |
          set -euo pipefail
          cmp LICENSE packages/ned-api/LICENSE
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          uv build --wheel --no-sources --out-dir "$work" packages/ned-api
          wheel="$work/ned_api-0.0.0-py3-none-any.whl"
          test -f "$wheel"
          uv venv --python "$(command -v python)" "$work/venv"
          uv pip freeze --python .venv/bin/python > "$work/constraints.txt"
          uv pip install --constraint "$work/constraints.txt" --python "$work/venv/bin/python" "$wheel"
          uv pip check --python "$work/venv/bin/python"
          aiohttp_version=$(uv run --no-sync python -c 'from importlib.metadata import version; print(version("aiohttp"))')
          yarl_version=$(uv run --no-sync python -c 'from importlib.metadata import version; print(version("yarl"))')
          "$work/venv/bin/python" -I - "$aiohttp_version" "$yarl_version" <<'PY'
          import importlib.util
          import sys
          from importlib.metadata import distribution
          from pathlib import Path

          import ned_api

          dist = distribution("ned-api")
          assert dist.version == "0.0.0"
          assert dist.metadata["License-Expression"] == "GPL-3.0-only"
          assert Path(ned_api.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          assert Path(ned_api.__file__).with_name("py.typed").is_file()
          assert any(str(path).endswith(".dist-info/licenses/LICENSE") for path in dist.files or ())
          assert importlib.util.find_spec("homeassistant") is None
          assert issubclass(ned_api.NedAuthenticationError, ned_api.NedApiError)
          assert distribution("aiohttp").version == sys.argv[1]
          assert distribution("yarl").version == sys.argv[2]
          assert callable(ned_api.NedTransport.async_get)
          print("Independent typed wheel, license, isolated import and exception exports passed.")
          PY
      - name: Exercise Dependabot merge policy offline
        shell: bash
        run: bash scripts/test_dependabot_automerge.sh
      - name: Validate synthetic and actual wheels via native HA requirements
        shell: bash
        run: bash scripts/check_runtime_distribution.sh
      - name: Audit installed dependencies
        if: ${{ !cancelled() && steps.lock.outcome == 'success' }}
        run: |
          if [[ -x .venv/bin/pip-audit ]]; then
            uv run --no-sync pip-audit
          else
            echo '::error::Dependency audit not possible: development installation incomplete.'
            exit 1
          fi
