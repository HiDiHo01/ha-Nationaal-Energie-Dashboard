version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "08:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 10
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
      time: "08:30"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 10
    allow:
      - dependency-type: all
    # Upgrade these together with the Core/Python release baseline.
    ignore:
      - dependency-name: homeassistant
      - dependency-name: pytest-homeassistant
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Independent PEP 621 package manifest; requires manual review.
  - package-ecosystem: pip
    directory: /packages/ned-api
    schedule:
      interval: daily
      time: "08:45"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: daily
      time: "09:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5

  - package-ecosystem: bundler
    directory: /site
    schedule:
      interval: daily
      time: "09:30"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
